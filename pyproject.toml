[project]
name = "ecommerce-scraper"
version = "1.0.0"
description = "CLI that scrapes the webscraper.io static e-commerce test site into a single JSON report."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Igor Litvinovich", email = "ihar.litvinovich@gmail.com" }]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.13",
    "httpx>=0.27",
    "lxml>=5.0",
]

[project.urls]
Repository = "https://github.com/igor-litvinovich/ecommerce-scraper"

[dependency-groups]
browser = [
    "playwright>=1.50",
]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_scraper"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "ASYNC", "PT", "RET", "C4", "PL",
]
ignore = [
    "PLR0913", # CLI wiring legitimately takes many keyword arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "-m", "not live"]
markers = [
    "live: hits the real webscraper.io site (deselected by default; run with `-m live`)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ecommerce_scraper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]
